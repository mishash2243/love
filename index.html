<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моя любовь к тебе</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Огромное сердце на фоне -->
  <div class="bg-heart">❤️</div>

  <!-- Маленький человечек сбоку (слева) -->
  <div class="little-me">
    <span class="me-icon">🧍‍♂️</span>
    <span class="me-text">твой любимый</span>
  </div>

  <!-- Главный блок по центру -->
  <div class="main-content" id="main-content">
    <h1>Моя любовь к тебе</h1>
    
    <!-- Стрелка и кнопка -->
    <div class="arrow-container" onclick="startCompliments()">
      <div class="arrow-text">Нажми сюда</div>
      <div class="arrow-down">⬇️</div>
    </div>
  </div>

  <!-- Контейнер для комплиментов -->
  <div id="compliments-container"></div>

  <script src="script.js"></script>
</body>
</html>
